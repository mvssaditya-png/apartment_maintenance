spring:
  application:
    name: maintenance-api

  datasource:
    url: jdbc:postgresql://localhost:5432/apartmentdb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: 0.0.0.0
  port: 8080

file:
  upload-dir: uploads
aws:
  s3:
    bucket-name: apartment-maintenance-files
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}