spring:
  application:
    name: maintenance-api

  datasource:
    url: jdbc:postgresql://localhost:5432/apartmentdb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: 0.0.0.0
  port: 8080

file:
  upload-dir: uploads
aws:
  s3:
    bucket-name: apartment-maintenance-files
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
msg91:
  enabled: true
  base-url: https://control.msg91.com/api/v5/flow
  auth-key: ${MSG91_AUTH_KEY:}
  sender-id: MBRSSS
  country-code: "91"
otp:
  expiry-minutes: 5
  max-requests: 5
  request-window-minutes: 15