spring:
  application:
    name: maintenance-api

  datasource:
    url: jdbc:postgresql://localhost:5432/maintenance_app
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
file:
    upload-dir: uploads